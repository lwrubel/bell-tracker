name: bell-tracker

databases:
  # DigitalOcean Managed Postgres. The database lives outside the container,
  # so redeploys and restarts no longer wipe it.
  # `production: false` provisions the cheaper shared dev database; set it to
  # true (and add `size`/`num_nodes`) for a dedicated cluster.
  - name: db
    engine: PG
    version: "17"
    production: false

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    github:
      repo: lwrubel/bell-tracker
      branch: main
      deploy_on_push: true
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # DO substitutes the managed cluster's real connection string, which
      # already carries ?sslmode=require. app/__init__.py rewrites the scheme
      # to postgresql+psycopg:// for SQLAlchemy.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # SMTP for password-reset emails. DigitalOcean may block port 587;
      # if sends time out, use your provider's port 2525 or 465 (with
      # MAIL_USE_SSL=true for 465).
      - key: MAIL_SERVER
        scope: RUN_TIME
        value: REPLACE_ME
      - key: MAIL_PORT
        scope: RUN_TIME
        value: "587"
      - key: MAIL_USE_SSL
        scope: RUN_TIME
        value: "false"
      - key: MAIL_USERNAME
        scope: RUN_TIME
        value: REPLACE_ME
      - key: MAIL_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_DEFAULT_SENDER
        scope: RUN_TIME
        value: REPLACE_ME
