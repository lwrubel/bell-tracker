name: bell-tracker

databases:
  # DigitalOcean Managed Postgres. The database lives outside the container,
  # so redeploys and restarts no longer wipe it.
  # `production: false` provisions the cheaper shared dev database; set it to
  # true (and add `size`/`num_nodes`) for a dedicated cluster.
  - name: db
    engine: PG
    version: "17"
    production: false

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    github:
      repo: lwrubel/bell-tracker
      branch: main
      deploy_on_push: true
    envs:
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # DO substitutes the managed cluster's real connection string, which
      # already carries ?sslmode=require. app/__init__.py rewrites the scheme
      # to postgresql+psycopg:// for SQLAlchemy.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # SMTP for password-reset emails, sent through Postmark. Port 2525
      # (STARTTLS) sidesteps DigitalOcean's possible block on 587.
      - key: MAIL_SERVER
        scope: RUN_TIME
        value: smtp.postmarkapp.com
      - key: MAIL_PORT
        scope: RUN_TIME
        value: "2525"
      - key: MAIL_USE_SSL
        scope: RUN_TIME
        value: "false"
      # Postmark's Server API Token is both the SMTP username and password,
      # so the username is a secret too.
      - key: MAIL_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Must be a verified sender signature or domain in Postmark.
      - key: MAIL_DEFAULT_SENDER
        scope: RUN_TIME
        value: REPLACE_ME
